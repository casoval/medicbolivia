# docker-compose.prod.yml
# Para correr EN EL VPS, reemplazando los procesos que hoy maneja PM2
# (ver ecosystem.config.js). A propósito NO incluye servicios de Postgres
# ni Redis — siguen siendo los que ya están instalados nativos en el VPS
# (ver scripts/deploy_vps.sh), sin tocar los datos existentes.
#
# Cada servicio usa network_mode: host (solo funciona en Linux, que es lo
# que corre el VPS) para que "localhost" adentro del contenedor sea el
# mismo localhost del VPS — así backend/.env y whatsapp-service/.env NO
# necesitan ningún cambio, siguen apuntando a localhost:5432, localhost:6379,
# localhost:6380, etc. tal como ya lo hacen para PM2 hoy. Nginx tampoco
# cambia: sigue haciendo proxy_pass a 127.0.0.1:4000 y 127.0.0.1:3000
# exactamente igual que ahora.
#
# Uso (en el VPS, como root o con sudo):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ver logs:
#   docker compose -f docker-compose.prod.yml logs -f backend
#
# Rollback instantáneo si algo sale mal (PM2 sigue instalado, no se borra):
#   docker compose -f docker-compose.prod.yml down
#   pm2 resurrect        # o: pm2 start ecosystem.config.js

services:

  backend:
    # image: apunta a lo que publica .github/workflows/build-push.yml en
    # GHCR. Con "image" + "build" juntos, "docker compose pull" trae la
    # imagen ya compilada por CI; "docker compose up --build" sigue
    # funcionando como fallback local si hace falta (ej. sin internet
    # hacia ghcr.io, o para debug rápido de un cambio sin pasar por CI).
    image: ghcr.io/casoval/medicbolivia-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    network_mode: host
    restart: unless-stopped
    # Techo defensivo: si algún día hay un memory leak, que se lo coma el
    # contenedor (Docker lo mata y restart:unless-stopped lo revive) en vez
    # de comerse la RAM del VPS entero, donde Postgres/Redis corren nativos
    # al lado (ver comentario de arriba). Los números salen de lo que ya
    # consume hoy en uso real (ver `docker stats`), con margen amplio.
    mem_limit: 1200m
    mem_reservation: 400m
    env_file:
      - ./backend/.env
    environment:
      # El entrypoint espera a Postgres antes de correr las migraciones —
      # con host networking, Postgres nativo está en localhost, no en un
      # hostname "postgres" de docker-compose (eso es solo para el compose
      # de desarrollo local).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    # Sin esto, restart:unless-stopped solo revive el contenedor si el
    # PROCESO se cae — pero si uvicorn queda vivo aunque colgado (deadlock,
    # loop infinito, lo que sea) y sigue respondiendo al healthcheck de
    # Docker por dentro sin problema, Docker jamás se entera de que algo
    # anda mal. Usa python3 (ya está en la imagen) en vez de curl, que no
    # viene instalado en python:3.12-slim — así no hay que agregar un
    # paquete nuevo solo para esto.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    image: ghcr.io/casoval/medicbolivia-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    network_mode: host
    restart: unless-stopped
    mem_limit: 800m
    mem_reservation: 250m
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    # `celery inspect ping` es la forma estándar de confirmar que el
    # worker no solo está vivo como proceso, sino que efectivamente
    # responde al broker — un worker colgado (sin poder conectar a Redis,
    # deadlock interno) puede seguir "corriendo" como proceso sin hacer
    # ningún trabajo real, y eso restart:unless-stopped no lo detecta.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  celery-beat:
    # Sin healthcheck a propósito: no hay una forma liviana y confiable de
    # confirmar "beat está funcionando de verdad" sin acoplarse a detalles
    # internos (el archivo celerybeat-schedule, su timestamp de última
    # escritura, etc.) — el costo de un chequeo frágil (falsos positivos
    # reiniciando el contenedor sin necesidad) supera el beneficio acá:
    # si beat se cuelga sin crashear, el peor caso es que los recordatorios
    # se atrasan hasta el próximo restart manual o deploy, no que se pierda
    # un evento crítico ni que un usuario quede sin poder usar la app.
    # El mem_limit de abajo ya cubre el caso de memory leak.
    image: ghcr.io/casoval/medicbolivia-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

  whatsapp-service:
    build: ./whatsapp-service
    network_mode: host
    restart: unless-stopped
    # init: true → usa el tini embebido de Docker como PID 1 del contenedor,
    # en vez de que "node src/index.js" (ver Dockerfile) corra directo como
    # PID 1. Motivo: cuando Chrome (Puppeteer) crashea o se reinicia, sus
    # procesos hijos (chrome_crashpad, renderers) quedan huérfanos y se
    # re-asignan a PID 1 para que alguien los "reapee" (wait()) — pero
    # Node.js NO hace ese trabajo de init automáticamente, así que quedan
    # como <defunct> para siempre (confirmado: 10 procesos zombie viejos
    # de un par de reinicios de Chrome el día que arrancó este contenedor,
    # ver `ps -eo pid,ppid,stat,cmd | grep Z` en el host). Con tini como
    # PID 1, cualquier zombie futuro se reapea solo, sin tocar el código
    # de la app ni el Dockerfile.
    init: true
    mem_limit: 1500m
    mem_reservation: 400m
    env_file:
      - ./whatsapp-service/.env
    volumes:
      # Bind mount al MISMO directorio que ya usa PM2 hoy (WHATSAPP_AUTH_DIR
      # en whatsapp-service/.env, default "./auth_info") — así la sesión de
      # WhatsApp ya vinculada se reutiliza y NO hay que volver a escanear
      # el QR al migrar a Docker.
      #
      # IMPORTANTE — permisos: el proceso adentro del contenedor corre como
      # pptruser (uid 10042, gid 999), pero esta carpeta del HOST puede quedar
      # con dueño root:root si se recrea a mano o se restaura de un backup.
      # Si eso pasa, Puppeteer va a fallar con "The browser is already running
      # for /app/auth_info/session" (en realidad es un error de permisos de
      # escritura sobre SingletonLock, mal interpretado por Puppeteer como un
      # browser vivo). Arreglo: chown -R 10042:999 sobre esta carpeta en el
      # HOST (no dentro del contenedor) antes de levantar el servicio.
      - /var/www/medicbolivia/whatsapp-service/auth_info:/app/auth_info
    # Pega al /health nuevo (sin autenticación, ver src/index.js) — a
    # propósito NO chequea si WhatsApp está conectado en este instante,
    # solo que el servidor Express esté vivo y respondiendo. Si dependiera
    # de connectionState==='connected', Docker podría reiniciar el
    # contenedor en medio de una reconexión legítima que la app ya está
    # manejando sola (ver disconnected/auth_failure/watchdog más arriba
    # en el código) — empeorando las cosas en vez de ayudar.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/casoval/medicbolivia-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    # /robots.txt es una ruta estática (prerenderizada en el build, ver
    # salida de `pnpm build`) — no depende de que el backend esté arriba,
    # así que esto solo mide si el propio servidor de Next.js está vivo,
    # sin falsos negativos si el backend está teniendo un mal momento.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/robots.txt',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Los healthchecks de arriba SOLO informan un estado ("unhealthy") —
  # Docker no reinicia nada por sí solo cuando eso pasa; restart:
  # unless-stopped únicamente actúa si el proceso se cae del todo, no si
  # queda vivo pero colgado (que es justo el caso que los healthchecks
  # están pensados para detectar). autoheal es la pieza que falta: mira
  # el estado de salud de todos los contenedores y reinicia los que
  # queden en "unhealthy" — cerrando el círculo de verdad. No necesita
  # network_mode: host porque solo habla con el daemon de Docker por su
  # socket, no por la red.
  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
