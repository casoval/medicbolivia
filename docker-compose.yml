# docker-compose.yml
# Entorno de DESARROLLO LOCAL para MedicBolivia. Levanta Postgres, Redis,
# backend (FastAPI + Alembic), Celery (worker + beat), frontend (Next.js) y
# el microservicio de WhatsApp, todos con hot-reload sobre el código del
# repo montado como volumen.
#
# Uso:
#   1. cp backend/.env.example backend/.env         → completar valores
#   2. cp whatsapp-service/.env.example whatsapp-service/.env
#   3. cp .env.example .env                          → password de Postgres
#   4. docker compose up --build
#
# NOTA: este compose es para desarrollo, no reemplaza (todavía) el
# despliegue de producción actual con PM2 en el VPS. Cuando estén listos
# para migrar producción a contenedores, este archivo es la base pero
# necesita variantes (sin --reload, con --workers, healthchecks más
# estrictos, secretos vía Docker secrets en vez de .env, etc.)

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicbolivia}
      POSTGRES_USER: ${POSTGRES_USER:-medicbolivia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicbolivia_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicbolivia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobreescribe SOLO lo que depende de estar dentro de Docker — el
      # resto (SECRET_KEY, API keys, etc.) sigue viniendo de backend/.env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      REDIS_URL: redis://redis:6379
      AUTH_REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      REDIS_URL: redis://redis:6379
      AUTH_REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-medicbolivia}:${POSTGRES_PASSWORD:-medicbolivia_dev_password}@postgres:5432/${POSTGRES_DB:-medicbolivia}
      REDIS_URL: redis://redis:6379
      AUTH_REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  whatsapp-service:
    build: ./whatsapp-service
    restart: unless-stopped
    env_file:
      - ./whatsapp-service/.env
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "4100:4100"
    volumes:
      - whatsapp_auth:/app/auth_info
    depends_on:
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/api/v1/chat/ws
      BACKEND_URL_FOR_DEV_PROXY: http://backend:4000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  pg_data:
  whatsapp_auth:
  frontend_node_modules:
  frontend_next_cache:
